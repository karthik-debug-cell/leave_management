<!DOCTYPE html>
<html lang="en" ng-app="leaveflow" ng-csp>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeaveFlow</title>
  <base href="/">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body ng-controller="ShellCtrl as shell" ng-cloak>

  <nav class="lf-nav" ng-if="shell.auth.isLoggedIn()">
    <div class="container-fluid px-4 d-flex align-items-center gap-4 flex-wrap">
      <a class="brand" ng-href="{{shell.auth.home()}}"><i class="bi bi-calendar2-check me-2"></i>LeaveFlow</a>

      <div class="d-flex gap-1 flex-grow-1" ng-if="shell.auth.isAdmin()">
        <a class="nav-link-lf" ng-class="{active: shell.is('/admin/dashboard')}" href="/admin/dashboard">Dashboard</a>
        <a class="nav-link-lf" ng-class="{active: shell.is('/admin/requests')}" href="/admin/requests">Requests</a>
        <a class="nav-link-lf" ng-class="{active: shell.is('/admin/employees')}" href="/admin/employees">Employees</a>
        <a class="nav-link-lf" ng-class="{active: shell.is('/admin/reports')}" href="/admin/reports">Reports</a>
      </div>
      <div class="d-flex gap-1 flex-grow-1" ng-if="!shell.auth.isAdmin()">
        <a class="nav-link-lf" ng-class="{active: shell.is('/employee/dashboard')}" href="/employee/dashboard">Dashboard</a>
        <a class="nav-link-lf" ng-class="{active: shell.is('/employee/apply')}" href="/employee/apply">Apply Leave</a>
        <a class="nav-link-lf" ng-class="{active: shell.is('/employee/history')}" href="/employee/history">My Leaves</a>
      </div>

      <div class="d-flex align-items-center gap-3 text-white">
        <span><i class="bi bi-person-circle me-1"></i>{{shell.auth.user.name}}
          <span class="badge bg-warning text-dark ms-1">{{shell.auth.user.role}}</span></span>
        <button class="btn btn-outline-light btn-sm" ng-click="shell.logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout</button>
      </div>
    </div>
  </nav>

  <div class="toast-wrap">
    <div class="alert alert-{{shell.flash.type}} shadow" ng-if="shell.flash">
      <i class="bi bi-info-circle-fill me-2"></i>{{shell.flash.message}}
    </div>
  </div>

  <main class="page-wrapper"><div class="container-fluid px-4" ng-view></div></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-route/1.8.3/angular-route.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services/auth.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/controllers/shell.js"></script>
  <script src="js/controllers/login.js"></script>
  <script src="js/controllers/employee.js"></script>
  <script src="js/controllers/admin.js"></script>
</body>
</html>
