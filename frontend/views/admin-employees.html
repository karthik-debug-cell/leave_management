<div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
  <div><h1 class="page-title">Employees</h1><p class="page-subtitle">Manage accounts and view leave summaries</p></div>
  <button class="btn btn-primary" ng-click="vm.showForm = !vm.showForm"><i class="bi bi-person-plus-fill me-2"></i>Add Employee</button>
</div>
<div class="card mb-4" ng-if="vm.showForm"><div class="card-header">New user</div><div class="card-body">
  <div class="alert alert-danger" ng-if="vm.error">{{vm.error}}</div>
  <form class="row g-3" ng-submit="vm.save()">
    <div class="col-md-4"><label class="form-label">Name *</label><input class="form-control" ng-model="vm.form.name" required></div>
    <div class="col-md-4"><label class="form-label">Email *</label><input type="email" class="form-control" ng-model="vm.form.email" required></div>
    <div class="col-md-4"><label class="form-label">Password * (min 6)</label><input type="password" class="form-control" ng-model="vm.form.password" minlength="6" required></div>
    <div class="col-md-4"><label class="form-label">Department</label><input class="form-control" ng-model="vm.form.department"></div>
    <div class="col-md-4"><label class="form-label">Role</label>
      <select class="form-select" ng-model="vm.form.role"><option value="employee">Employee</option><option value="admin">Admin</option></select></div>
    <div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary">Create user</button></div>
  </form></div></div>
<div class="card"><div class="card-body p-0"><table class="table table-custom mb-0">
  <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Department</th><th>Total</th><th>Pending</th><th>Approved</th><th>Joined</th><th></th></tr></thead>
  <tbody><tr ng-repeat="e in vm.employees">
    <td class="text-muted">{{$index + 1}}</td><td><strong>{{e.name}}</strong></td><td>{{e.email}}</td><td>{{e.department || '—'}}</td>
    <td>{{e.total_leaves}}</td><td>{{e.pending}}</td><td>{{e.approved}}</td><td>{{e.created_at | date:'dd MMM yyyy'}}</td>
    <td><a class="btn btn-outline-secondary btn-sm" ng-href="/admin/requests?user_id={{e.id}}">Requests</a></td>
  </tr></tbody></table></div></div>
